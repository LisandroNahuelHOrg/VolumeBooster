<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1400, height=560, initial-scale=1.0" />
    <title>Marquee 02 ES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./Estilos Base Publicacion.css" />
    <script src="./Guardia Artboard.js"></script>
    <style>
      body {
        background:
          radial-gradient(circle at 10% 24%, rgba(255, 210, 77, 0.16), transparent 24%),
          radial-gradient(circle at 84% 20%, rgba(118, 220, 255, 0.18), transparent 26%),
          linear-gradient(145deg, #07111f 0%, #0c1830 48%, #15274a 100%);
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr 520px;
        width: 100%;
        height: 100%;
        gap: 28px;
        padding: 34px 44px;
        align-items: center;
      }

      .copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 16px;
      }

      .headline {
        max-width: 540px;
        font-size: 66px;
      }

      .headline .accent {
        color: #ffd24d;
      }

      .subtitle {
        max-width: 500px;
        font-size: 22px;
      }

      .visual {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .visual-shell {
        width: 100%;
        max-width: 480px;
        padding: 14px;
        border-radius: 30px;
      }

      .screenshot-frame {
        width: 100%;
        height: auto;
        border-radius: 24px;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="grid-noise"></div>
      <div class="orb a" style="left: -30px; top: 40px; width: 300px; height: 300px"></div>
      <div class="orb b" style="right: 30px; top: -30px; width: 260px; height: 260px"></div>
      <div class="safe-frame" data-safe-frame>
        <div class="layout">
          <section class="copy" data-safe-item data-safe-label="Marquee 02 copy">
            <h1 class="headline">Rutas visibles. <span class="accent">Presets listos.</span></h1>
            <p class="subtitle">Todo lo importante queda arriba y al centro: tab activo, modos de booster y grilla de niveles rapidos para entrar sin perder tiempo.</p>
          </section>
          <section class="visual">
            <div class="visual-shell panel" data-safe-item data-safe-label="Marquee 02 visual shell">
              <div class="screenshot-frame" data-shot-ratio="auto" data-shot-fit="contain">
                <img src="../Capturas Base/Control Presets Espanol.png" alt="Presets y slider principal del booster" />
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </body>
</html>
