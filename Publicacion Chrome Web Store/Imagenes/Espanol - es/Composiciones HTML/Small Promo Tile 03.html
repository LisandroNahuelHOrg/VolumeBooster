<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=440, height=280, initial-scale=1.0" />
    <title>Small Promo Tile 03 ES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./Estilos Base Publicacion.css" />
    <script src="./Guardia Artboard.js"></script>
    <style>
      body {
        background:
          radial-gradient(circle at 10% 18%, rgba(89, 208, 255, 0.22), transparent 30%),
          radial-gradient(circle at 82% 72%, rgba(255, 210, 77, 0.18), transparent 24%),
          linear-gradient(145deg, #07111f 0%, #0c1830 48%, #15274a 100%);
      }

      .tile {
        width: 100%;
        height: 100%;
        padding: 4px;
      }

      .promo-title .accent {
        color: #ffd24d;
      }
    </style>
  </head>
  <body class="promo-tight">
    <div class="canvas">
      <div class="orb a" style="left: -46px; top: -84px"></div>
      <div class="orb b" style="right: -8px; top: 118px"></div>
      <div class="safe-frame" data-safe-frame>
        <div class="tile">
          <div class="promo-card panel" data-safe-item data-safe-label="Promo 03 card">
            <div class="promo-tile-grid">
              <div class="promo-copy" data-safe-item data-safe-label="Promo 03 copy">
                <h1 class="promo-title">Preset <span class="accent">listo</span>.</h1>
                <p class="promo-support">Ganancia rapida, lectura clara.</p>
              </div>

              <div
                class="promo-shot screenshot-frame"
                data-shot-ratio="auto"
                data-shot-fit="contain"
                data-safe-item
                data-safe-label="Promo 03 screenshot"
              >
                <img src="../Capturas Base/Promo Tile Presets Cercano Espanol.png" alt="Preset rapido y slider principal" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
