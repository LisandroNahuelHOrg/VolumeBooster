<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=440, height=280, initial-scale=1.0" />
    <title>Small Promo Tile 01 ES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./Estilos Base Publicacion.css" />
    <script src="./Guardia Artboard.js"></script>
    <style>
      body {
        background:
          radial-gradient(circle at 12% 18%, rgba(89, 208, 255, 0.2), transparent 28%),
          radial-gradient(circle at 82% 78%, rgba(255, 210, 77, 0.16), transparent 24%),
          linear-gradient(145deg, #07111f 0%, #0c1830 48%, #15274a 100%);
      }

      .tile {
        width: 100%;
        height: 100%;
        padding: 4px;
      }

      .promo-title .accent {
        color: #ffd24d;
      }
    </style>
  </head>
  <body class="promo-tight">
    <div class="canvas">
      <div class="orb a" style="left: -40px; top: -80px"></div>
      <div class="orb b" style="right: -10px; top: 110px"></div>
      <div class="safe-frame" data-safe-frame>
        <div class="tile">
          <div class="promo-card panel" data-safe-item data-safe-label="Promo 01 card">
            <div class="promo-tile-grid">
              <div class="promo-copy" data-safe-item data-safe-label="Promo 01 copy">
                <h1 class="promo-title">Boost <span class="accent">claro</span>.</h1>
                <p class="promo-support">Mas volumen, control legible.</p>
              </div>

              <div
                class="promo-shot screenshot-frame"
                data-shot-ratio="auto"
                data-shot-fit="contain"
                data-safe-item
                data-safe-label="Promo 01 screenshot"
              >
                <img src="../Capturas Base/Promo Tile Panel Espanol.png" alt="Panel principal compacto del booster" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
