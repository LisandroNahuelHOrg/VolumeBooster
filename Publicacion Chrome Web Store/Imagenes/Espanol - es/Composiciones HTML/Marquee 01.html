<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1400, height=560, initial-scale=1.0" />
    <title>Marquee 01 ES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./Estilos Base Publicacion.css" />
    <script src="./Guardia Artboard.js"></script>
    <style>
      .layout {
        display: grid;
        grid-template-columns: 1fr 460px;
        width: 100%;
        height: 100%;
        gap: 28px;
        padding: 34px 44px;
        align-items: center;
      }

      .copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 14px;
      }

      .headline {
        max-width: 560px;
        font-size: 66px;
      }

      .headline .accent { color:#ffd24d; }

      .subtitle {
        max-width: 520px;
        font-size: 22px;
      }

      .visual { display:flex; align-items:center; justify-content:center; }

      .visual-shell {
        width: 100%;
        max-width: 430px;
        padding: 14px;
        border-radius: 30px;
      }

      .screenshot-frame {
        width: 100%;
        height: auto;
        border-radius: 24px;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="grid-noise"></div><div class="orb a" style="width:360px;height:360px"></div><div class="orb b" style="width:300px;height:300px;right:120px;top:0"></div>
      <div class="safe-frame" data-safe-frame>
        <div class="layout">
          <section class="copy" data-safe-item data-safe-label="Marquee 01 copy">
            <h1 class="headline">Mas volumen. <span class="accent">Mismo control.</span></h1>
            <p class="subtitle">Sube el audio de Chrome con presets rapidos, rutas visibles y un panel listo para decidir sin friccion.</p>
          </section>
          <section class="visual">
            <div class="visual-shell panel" data-safe-item data-safe-label="Marquee 01 visual shell">
              <div class="screenshot-frame" data-shot-ratio="auto" data-shot-fit="contain">
                <img src="../Capturas Base/Panel Completo Espanol 01.png" alt="Panel principal de Prism Volume Booster" />
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </body>
</html>
