<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=800, initial-scale=1.0" />
    <title>Secundaria 01 ES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./Estilos Base Publicacion.css" />
    <script src="./Guardia Artboard.js"></script>
    <style>
      body { background: linear-gradient(145deg, #06111d 0%, #0d1a31 50%, #182946 100%); }
      .layout { display: grid; grid-template-columns: 0.92fr 1.08fr; gap: 34px; width: 100%; height: 100%; padding: 54px; }
      .left { display: grid; align-content: center; gap: 18px; }
      .right { display: flex; align-items: center; justify-content: center; }
      .shot { width: 100%; padding: 16px; border-radius: 34px; }
      .shot .screenshot-frame { width: 100%; height: auto; aspect-ratio: 800 / 340; border-radius: 24px; }
      .headline { max-width: 500px; font-size: 68px; }
      .headline .accent { color: #ffd24d; }
      .subtitle { max-width: 470px; font-size: 22px; }
      .proof-card { padding: 18px 20px; border-radius: 22px; background: rgba(8, 18, 38, 0.66); border: 1px solid rgba(255, 255, 255, 0.12); }
      .proof-card strong { display:block; margin-bottom:8px; font-size:18px; }
      .proof-card span { color: var(--muted); font-size:15px; line-height:1.4; }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="grid-noise"></div><div class="orb a"></div><div class="orb b"></div>
      <div class="safe-frame" data-safe-frame>
        <div class="layout">
          <section class="left">
            <div data-safe-item data-safe-label="Secundaria 01 copy">
              <h1 class="headline">Activa el <span class="accent">carril correcto</span> sin perder contexto.</h1>
              <p class="subtitle">La pestana actual, el aviso de captura y las rutas manual/global quedan juntos arriba del panel.</p>
            </div>
            <div class="proof-card" data-safe-item data-safe-label="Secundaria 01 proof">
              <strong>Contexto antes que clics ciegos</strong>
              <span>El usuario ve en segundos si esta en un tab compatible y que ruta de booster tiene disponible.</span>
            </div>
          </section>
          <section class="right">
            <div class="shot panel" data-safe-item data-safe-label="Secundaria 01 screenshot shell">
              <div class="screenshot-frame" data-shot-ratio="auto" data-shot-fit="contain">
                <img src="../Capturas Base/Carril Superior Espanol.png" alt="Carril superior y modos de booster" />
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </body>
</html>
