<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=800, initial-scale=1.0" />
    <title>Secundaria 04 ES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./Estilos Base Publicacion.css" />
    <script src="./Guardia Artboard.js"></script>
    <style>
      body {
        background:
          radial-gradient(circle at 12% 70%, rgba(255, 210, 77, 0.16), transparent 22%),
          radial-gradient(circle at 82% 18%, rgba(118, 220, 255, 0.18), transparent 24%),
          linear-gradient(145deg, #06111d 0%, #0d1a31 48%, #182946 100%);
      }

      .layout {
        display: grid;
        grid-template-columns: 0.94fr 1.06fr;
        gap: 34px;
        width: 100%;
        height: 100%;
        align-items: center;
      }

      .copy {
        display: grid;
        gap: 18px;
        align-content: center;
      }

      .headline {
        max-width: 520px;
        font-size: 66px;
      }

      .headline .accent {
        color: #ffd24d;
      }

      .subtitle {
        max-width: 520px;
        font-size: 22px;
      }

      .proof-card {
        max-width: 520px;
        padding: 18px 20px;
        border-radius: 22px;
        background: rgba(8, 18, 38, 0.68);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .proof-card strong {
        display: block;
        margin-bottom: 8px;
        font-size: 18px;
      }

      .proof-card span {
        color: var(--muted);
        font-size: 15px;
        line-height: 1.4;
      }

      .visual {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .shot {
        width: 100%;
        padding: 18px;
        border-radius: 34px;
      }

      .shot .screenshot-frame {
        width: 100%;
        height: auto;
        border-radius: 24px;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="grid-noise"></div>
      <div class="orb a"></div>
      <div class="orb b"></div>
      <div class="safe-frame" data-safe-frame>
        <div class="layout">
          <section class="copy">
            <div data-safe-item data-safe-label="Secundaria 04 copy">
              <h1 class="headline">Ajusta fino con <span class="accent">feedback</span> visible.</h1>
              <p class="subtitle">El slider principal, la actividad en vivo y el riesgo de distorsion permanecen juntos para no empujar el volumen a ciegas.</p>
            </div>
            <div class="proof-card" data-safe-item data-safe-label="Secundaria 04 proof">
              <strong>Menos prueba y error</strong>
              <span>La misma superficie que sube el audio te deja leer actividad y estabilidad antes de sobrepasarte.</span>
            </div>
          </section>

          <section class="visual">
            <div class="shot panel" data-safe-item data-safe-label="Secundaria 04 screenshot shell">
              <div class="screenshot-frame" data-shot-ratio="auto" data-shot-fit="contain">
                <img src="../Capturas Base/Slider y Actividad Espanol.png" alt="Slider principal, actividad y riesgo de distorsion" />
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </body>
</html>
