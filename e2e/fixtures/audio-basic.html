<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fixture: Audio Basic</title>
    <script src="/media-fixture.js"></script>
  </head>
  <body>
    <main>
      <h1>Audio basic fixture</h1>
      <p>Static audio element present from first paint. Playback starts after clicking the button.</p>
      <div id="fixture-target"></div>
      <button id="start-playback" type="button">Start playback</button>
    </main>
    <script>
      window.PrismFixture.ensureAudio("fixture-target", "fixture-audio");
      document.getElementById("start-playback").addEventListener("click", async () => {
        const started = await window.PrismFixture.playElementById("fixture-audio");
        document.body.dataset.playing = String(started);
      });
    </script>
  </body>
</html>
