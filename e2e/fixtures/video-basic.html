<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fixture: Video Basic</title>
    <script src="/media-fixture.js"></script>
  </head>
  <body>
    <main>
      <h1>Video basic fixture</h1>
      <p>Static video element present from first paint. It uses an audio WAV source to exercise the HTMLVideoElement path deterministically.</p>
      <div id="fixture-target"></div>
      <button id="start-playback" type="button">Start playback</button>
    </main>
    <script>
      window.PrismFixture.ensureVideo("fixture-target", "fixture-video");
      document.getElementById("start-playback").addEventListener("click", async () => {
        const started = await window.PrismFixture.playElementById("fixture-video");
        document.body.dataset.playing = String(started);
      });
    </script>
  </body>
</html>
