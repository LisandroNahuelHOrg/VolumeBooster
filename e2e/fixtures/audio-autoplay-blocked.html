<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fixture: Audio Autoplay Blocked</title>
    <script src="/media-fixture.js"></script>
  </head>
  <body>
    <main>
      <h1>Audio autoplay-blocked fixture</h1>
      <p>The audio element exists from first paint and tries to autoplay before user interaction.</p>
      <div id="fixture-target"></div>
      <button id="unlock-playback" type="button">Unlock playback</button>
    </main>
    <script>
      window.PrismFixture.ensureAudio("fixture-target", "fixture-audio");
      window.PrismFixture.playElementById("fixture-audio").then((started) => {
        document.body.dataset.autoplayStarted = String(started);
      });

      document.getElementById("unlock-playback").addEventListener("click", async () => {
        const started = await window.PrismFixture.playElementById("fixture-audio");
        document.body.dataset.playing = String(started);
      });
    </script>
  </body>
</html>
